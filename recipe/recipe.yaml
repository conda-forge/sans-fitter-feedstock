schema_version: 1

context:
  version: "0.3.0"
  python_min: "3.12"

package:
  name: sans-fitter
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sans-fitter/sans_fitter-${{ version }}.tar.gz
  sha256: f16cbdd9ab42a7cc53eb23cf6746157305365dc51554eb1e473975c40399d787

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.0
    - plotly >=5.0
    - scipy >=1.7
    - sasmodels >=1.0
    - sasdata >=0.8
    - bumps >=1.0
    - jupyter >=1.0
    - notebook >=7.0
    - ipykernel >=6.0
    - ipywidgets >=8.0
    - columnize

tests:
  - python:
      imports:
        - sans_fitter
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A flexible template for fitting SANS data with SasModels
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/sans-fitter
  repository: https://github.com/ai4se1dk/SANS-fitter
  documentation: https://ai4se1dk.github.io/SANS-fitter/usage


extra:
  recipe-maintainers:
    - MridulS
